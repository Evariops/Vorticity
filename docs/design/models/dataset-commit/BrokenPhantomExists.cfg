\* A store that answers Exists for a creation its own put made, which PutOutcome.Exists forbids: the
\* writer rebases onto its own commit, a compaction has taken its object out of level 0 meanwhile, and
\* the append adds the object a second time. Must violate NoDuplicate.
SPECIFICATION Spec
CONSTANTS
    Appenders = {"a1"}
    Deleters = {}
    Compactors = {"c1"}
    Keys = {1, 2}
    MaxLevel = 2
    Jobs = 1
    MaxAttempts = 2
    Crashes = FALSE
    PhantomExists = TRUE
    Seed = FALSE
    UidInKey = TRUE
    RewalkDestination = TRUE
    CheckExpected = TRUE
INVARIANT NoDuplicate
CHECK_DEADLOCK FALSE
