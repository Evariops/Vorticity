\* Two appenders and a compactor running two jobs over three levels, a seeded object in level 1,
\* puts that may land without their writer learning it.
SPECIFICATION Spec
CONSTANTS
    Appenders = {"a1", "a2"}
    Deleters = {}
    Compactors = {"c1"}
    Keys = {1, 2}
    MaxLevel = 2
    Jobs = 2
    MaxAttempts = 2
    Crashes = TRUE
    PhantomExists = FALSE
    Seed = TRUE
    UidInKey = TRUE
    RewalkDestination = TRUE
    CheckExpected = TRUE
INVARIANT NoDuplicate NoLostRow NoResurrection KeyDisjoint
CHECK_DEADLOCK FALSE
