\* An appender and two compactors, one job each, over a seeded level 1: one job may empty level 0 into
\* level 2 while the other pushes level 1's object into level 2, the race the second look at the
\* destination's range answers.
SPECIFICATION Spec
CONSTANTS
    Appenders = {"a1"}
    Deleters = {}
    Compactors = {"c1", "c2"}
    Keys = {1, 2}
    MaxLevel = 2
    Jobs = 1
    MaxAttempts = 2
    Crashes = TRUE
    PhantomExists = FALSE
    Seed = TRUE
    UidInKey = TRUE
    RewalkDestination = TRUE
    CheckExpected = TRUE
INVARIANT NoDuplicate NoLostRow NoResurrection KeyDisjoint
CHECK_DEADLOCK FALSE
