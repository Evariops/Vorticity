\* Every kind of actor at once: two appenders, a deleter and a compactor running two jobs, over three
\* levels and a seeded object, puts that may land with their writer dying before it learns it. Run on
\* demand: with a second compactor the state space passes ten gigabytes and fifteen minutes.
SPECIFICATION Spec
CONSTANTS
    Appenders = {"a1", "a2"}
    Deleters = {"d1"}
    Compactors = {"c1"}
    Keys = {1, 2}
    MaxLevel = 2
    Jobs = 2
    MaxAttempts = 2
    Crashes = TRUE
    PhantomExists = FALSE
    Seed = TRUE
    UidInKey = TRUE
    RewalkDestination = TRUE
    CheckExpected = TRUE
INVARIANT NoDuplicate NoLostRow NoResurrection KeyDisjoint
CHECK_DEADLOCK FALSE
