\* A replacement that does not look at its destination's range again at commit: a job emptying level 0
\* into level 2 and a job pushing level 1's object into level 2 share no input, and their outputs
\* overlap. Must violate KeyDisjoint.
SPECIFICATION Spec
CONSTANTS
    Appenders = {"a1"}
    Deleters = {}
    Compactors = {"c1", "c2"}
    Keys = {1, 2}
    MaxLevel = 2
    Jobs = 1
    MaxAttempts = 2
    Crashes = FALSE
    PhantomExists = FALSE
    Seed = TRUE
    UidInKey = TRUE
    RewalkDestination = FALSE
    CheckExpected = TRUE
INVARIANT KeyDisjoint
CHECK_DEADLOCK FALSE
