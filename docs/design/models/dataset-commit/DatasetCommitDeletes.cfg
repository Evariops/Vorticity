\* An appender, a deleter and a compactor running two jobs: deletes that mark rows in objects a job
\* read before them, and jobs that merge objects a delete marked.
SPECIFICATION Spec
CONSTANTS
    Appenders = {"a1"}
    Deleters = {"d1"}
    Compactors = {"c1"}
    Keys = {1, 2}
    MaxLevel = 2
    Jobs = 2
    MaxAttempts = 2
    Crashes = TRUE
    PhantomExists = FALSE
    Seed = TRUE
    UidInKey = TRUE
    RewalkDestination = TRUE
    CheckExpected = TRUE
INVARIANT NoDuplicate NoLostRow NoResurrection KeyDisjoint
CHECK_DEADLOCK FALSE
