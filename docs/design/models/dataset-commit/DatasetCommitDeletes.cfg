\* Two appenders, a deleter and a compactor running two jobs: deletes that take out objects of one key
\* whole and mark rows in the objects of two a job merged, some of which a job read before them, and
\* jobs that merge objects a delete marked. Writers do not die here, which DatasetCommitAll covers.
SPECIFICATION Spec
CONSTANTS
    Appenders = {"a1", "a2"}
    Deleters = {"d1"}
    Compactors = {"c1"}
    Keys = {1, 2}
    MaxLevel = 2
    Jobs = 2
    MaxAttempts = 2
    Crashes = FALSE
    PhantomExists = FALSE
    Seed = TRUE
    UidInKey = TRUE
    RewalkDestination = TRUE
    CheckExpected = TRUE
INVARIANT NoDuplicate NoLostRow NoResurrection KeyDisjoint
CHECK_DEADLOCK FALSE
