\* A replacement that checks only that its inputs are still there, not that their entries are the ones
\* it read: a job that read an object before a delete marked rows in it writes those rows back. Must
\* violate NoResurrection.
SPECIFICATION Spec
CONSTANTS
    Appenders = {"a1"}
    Deleters = {"d1"}
    Compactors = {"c1"}
    Keys = {1, 2}
    MaxLevel = 2
    Jobs = 1
    MaxAttempts = 2
    Crashes = FALSE
    PhantomExists = FALSE
    Seed = TRUE
    UidInKey = TRUE
    RewalkDestination = TRUE
    CheckExpected = FALSE
INVARIANT NoResurrection
CHECK_DEADLOCK FALSE
