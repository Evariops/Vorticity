\* Witness: an operation is abandoned on the version it lands on, so the rules that abandon are
\* exercised by the configurations that pass. Must violate NoAbandon.
SPECIFICATION Spec
CONSTANTS
    Appenders = {"a1"}
    Deleters = {"d1"}
    Compactors = {"c1"}
    Keys = {1, 2}
    MaxLevel = 2
    Jobs = 2
    MaxAttempts = 2
    Crashes = TRUE
    PhantomExists = FALSE
    Seed = TRUE
    UidInKey = TRUE
    RewalkDestination = TRUE
    CheckExpected = TRUE
INVARIANT NoAbandon
CHECK_DEADLOCK FALSE
