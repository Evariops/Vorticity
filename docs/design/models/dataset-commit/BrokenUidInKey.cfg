\* A tree key without the object's uid: two appends of one key prepared on one version compute one tree
\* key, and the second replaces the first. Must violate NoLostRow.
SPECIFICATION Spec
CONSTANTS
    Appenders = {"a1", "a2"}
    Deleters = {}
    Compactors = {}
    Keys = {1}
    MaxLevel = 2
    Jobs = 0
    MaxAttempts = 2
    Crashes = FALSE
    PhantomExists = FALSE
    Seed = FALSE
    UidInKey = FALSE
    RewalkDestination = TRUE
    CheckExpected = TRUE
INVARIANT NoLostRow
CHECK_DEADLOCK FALSE
