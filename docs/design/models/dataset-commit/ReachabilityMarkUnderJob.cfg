\* Witness: a delete marks rows in an object a job read before them, the job still to commit. Two
\* appenders, since only an object of two keys is marked rather than taken out whole. Must violate
\* NoMarkUnderJob.
SPECIFICATION Spec
CONSTANTS
    Appenders = {"a1", "a2"}
    Deleters = {"d1"}
    Compactors = {"c1"}
    Keys = {1, 2}
    MaxLevel = 2
    Jobs = 2
    MaxAttempts = 2
    Crashes = TRUE
    PhantomExists = FALSE
    Seed = TRUE
    UidInKey = TRUE
    RewalkDestination = TRUE
    CheckExpected = TRUE
INVARIANT NoMarkUnderJob
CHECK_DEADLOCK FALSE
