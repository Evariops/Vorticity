\* A commit that changes an entry and leaves the rollups over its key in place. Must violate RollupsTrue.
SPECIFICATION Spec
CONSTANTS
    Keys = {1, 2, 3}
    Writers = {1}
    Changes = 1
    Builders = {"b1"}
    Rollups = 1
    CheckFingerprint = TRUE
    TakeAway = FALSE
INVARIANT RollupsTrue
CHECK_DEADLOCK FALSE
