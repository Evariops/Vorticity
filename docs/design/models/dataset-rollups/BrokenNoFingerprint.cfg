\* A rollup put over its range whatever the range holds now: summed before a change, committed after it.
\* Must violate RollupsTrue.
SPECIFICATION Spec
CONSTANTS
    Keys = {1, 2, 3}
    Writers = {1}
    Changes = 1
    Builders = {"b1"}
    Rollups = 1
    CheckFingerprint = FALSE
    TakeAway = TRUE
INVARIANT RollupsTrue
CHECK_DEADLOCK FALSE
