\* Witness: an object lands after a rekey, sealed under the new key, so the refusal does not refuse every
\* write past a rekey. Must violate NoWriteAfterRekey.
SPECIFICATION Spec
CONSTANTS
    Writers = {"w1", "w2", "w3"}
    Rekeys = 2
    Refuse = TRUE
INVARIANT NoWriteAfterRekey
CHECK_DEADLOCK FALSE
