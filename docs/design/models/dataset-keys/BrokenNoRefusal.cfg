\* The commit as the code had it: no look at the key an object was begun under. A writer seals under the
\* first key, a rekey lands, and the writer's commit adds its object to a version of the second. Must
\* violate SealedUnderItsVersion.
SPECIFICATION Spec
CONSTANTS
    Writers = {"w1"}
    Rekeys = 1
    Refuse = FALSE
INVARIANT SealedUnderItsVersion
CHECK_DEADLOCK FALSE
