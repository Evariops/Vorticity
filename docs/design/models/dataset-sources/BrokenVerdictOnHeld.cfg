\* A verdict other than applying taken as final on a version the writer held: the gap it sees there was
\* filled since, and the writer is told its range conflicts though it starts at the latest offset.
\* Must violate NoSpuriousConflict.
SPECIFICATION Spec
CONSTANTS
    Writers = {"w1", "w2"}
    Entries = 3
    MaxAttempts = 3
    Crashes = FALSE
    JudgeEachAttempt = TRUE
    AskBeforeVerdict = FALSE
INVARIANT NoSpuriousConflict
CHECK_DEADLOCK FALSE
