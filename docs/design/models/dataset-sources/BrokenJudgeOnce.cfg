\* The range judged once, on the version the writer prepared on, rather than on the version each attempt
\* lands on: a writer that rebases onto a version where another counted its range counts it again.
\* Must violate ExactlyOnce.
SPECIFICATION Spec
CONSTANTS
    Writers = {"w1", "w2"}
    Entries = 2
    MaxAttempts = 3
    Crashes = FALSE
    JudgeEachAttempt = FALSE
    AskBeforeVerdict = TRUE
INVARIANT ExactlyOnce
CHECK_DEADLOCK FALSE
