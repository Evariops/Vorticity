\* Three lanes of three batches each under a budget of four units, the merge reserving its growth: the
\* tables never pass the budget, the budget counts what they hold, and every lane ends.
SPECIFICATION Spec
CONSTANTS
    Lanes = {"l1", "l2", "l3"}
    Ceiling = 4
    Batches = 3
    ReserveAhead = TRUE
INVARIANT WithinCeiling Counted
PROPERTY EveryLaneEnds
CHECK_DEADLOCK FALSE
