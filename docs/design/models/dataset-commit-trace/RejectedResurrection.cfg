\* module: DatasetCommitTrace
\* A run made by hand: RunMarks, then a job that writes the rows the delete marked back. No behaviour of
\* the model creates it, so NotFollowed must hold: exit 0, the run rejected.
SPECIFICATION TraceSpec
CONSTANTS
    Appenders = {"a1", "a2"}
    Deleters = {"d1"}
    Compactors = {"c1"}
    Keys = {1, 2}
    MaxLevel = 2
    Jobs = 2
    MaxAttempts = 4
    Crashes = FALSE
    PhantomExists = FALSE
    Seed = TRUE
    UidInKey = TRUE
    RewalkDestination = TRUE
    CheckExpected = TRUE
    TraceHistory <- ResurrectedRow
INVARIANT NotFollowed
CHECK_DEADLOCK FALSE
