\* module: DatasetCommitTrace
\* A run of two appends and two jobs, recorded from the code. Must violate NotFollowed: the model
\* creates its versions in its order.
SPECIFICATION TraceSpec
CONSTANTS
    Appenders = {"a1", "a2"}
    Deleters = {}
    Compactors = {"c1"}
    Keys = {1, 2}
    MaxLevel = 2
    Jobs = 2
    MaxAttempts = 4
    Crashes = FALSE
    PhantomExists = FALSE
    Seed = TRUE
    UidInKey = TRUE
    RewalkDestination = TRUE
    CheckExpected = TRUE
    TraceHistory <- RunAppends
INVARIANT NotFollowed
CHECK_DEADLOCK FALSE
