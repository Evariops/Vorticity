\* module: DatasetCommitTrace
\* A run of two appends, a job that merges them with the seed, and a delete that marks rows in the
\* merged object, recorded from the code. Must violate NotFollowed.
SPECIFICATION TraceSpec
CONSTANTS
    Appenders = {"a1", "a2"}
    Deleters = {"d1"}
    Compactors = {"c1"}
    Keys = {1, 2}
    MaxLevel = 2
    Jobs = 1
    MaxAttempts = 4
    Crashes = FALSE
    PhantomExists = FALSE
    Seed = TRUE
    UidInKey = TRUE
    RewalkDestination = TRUE
    CheckExpected = TRUE
    TraceHistory <- RunMarks
INVARIANT NotFollowed
CHECK_DEADLOCK FALSE
