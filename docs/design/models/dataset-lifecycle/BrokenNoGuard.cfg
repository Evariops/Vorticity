\* The commit as the code had it: no guard on how long ago its objects were put. A writer uploads, waits a
\* window, vacuum deletes its object as an orphan, and the commit names it. Must violate LatestReadable.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1}
    Window = 4
    TrustSpan = 2
    VacuumSkew = 0
    WriterDrift = 0
    ListingLag = 0
    MaxTime = 8
    MaxVersions = 3
    Passes = 1
    Refreshes = FALSE
    Guard = FALSE
SYMMETRY Symmetry
INVARIANT LatestReadable
CHECK_DEADLOCK FALSE
