\* The vacuum's clock three ticks ahead, past the half window the guard leaves: it takes the object of
\* a writer that commits within the guard for an orphan a window old. Must violate LatestReadable.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2, w3}
    Window = 4
    TrustSpan = 2
    VacuumSkew = 3
    WriterDrift = 0
    ListingLag = 0
    MaxTime = 8
    MaxVersions = 4
    Passes = 2
    Refreshes = FALSE
    Guard = TRUE
SYMMETRY Symmetry
INVARIANT LatestReadable
CHECK_DEADLOCK FALSE
