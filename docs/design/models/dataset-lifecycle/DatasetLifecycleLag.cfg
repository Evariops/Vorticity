\* A listing that may miss a version created less than two ticks ago, a lag of a tick and some, with the
\* vacuum's clock a tick off: the lag and the skew use up the half window the guard leaves.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2, w3}
    Window = 4
    TrustSpan = 2
    VacuumSkew = 1
    WriterDrift = 0
    ListingLag = 2
    MaxTime = 7
    MaxVersions = 4
    Passes = 2
    Refreshes = FALSE
    Guard = TRUE
SYMMETRY Symmetry
INVARIANT LatestReadable NoFork RetainedReadable
CHECK_DEADLOCK FALSE
