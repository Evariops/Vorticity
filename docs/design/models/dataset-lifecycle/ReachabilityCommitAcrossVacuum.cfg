\* Witness: vacuum sweeps between a writer's put and its commit, and the commit goes through, so the
\* guard is checked against the race it is for. Must violate NoCommitAcrossVacuum.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2, w3}
    Window = 4
    TrustSpan = 2
    VacuumSkew = 1
    WriterDrift = 1
    ListingLag = 0
    MaxTime = 8
    MaxVersions = 4
    Passes = 2
    Refreshes = FALSE
    Guard = TRUE
SYMMETRY Symmetry
INVARIANT NoCommitAcrossVacuum
CHECK_DEADLOCK FALSE
