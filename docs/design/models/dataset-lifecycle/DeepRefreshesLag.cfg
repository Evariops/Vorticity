\* Writers that refresh, over a listing that may miss a version created less than three ticks ago: a
\* refresh can take for the latest a version the listing showed while a later one stood, and trust it,
\* which the lag allows as long as it leaves the trust span its half window. Takes minutes.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2, w3}
    Window = 4
    TrustSpan = 2
    VacuumSkew = 0
    WriterDrift = 0
    ListingLag = 3
    MaxTime = 8
    MaxVersions = 4
    Passes = 1
    Refreshes = TRUE
    Guard = TRUE
SYMMETRY Symmetry
INVARIANT LatestReadable NoFork RetainedReadable
CHECK_DEADLOCK FALSE
