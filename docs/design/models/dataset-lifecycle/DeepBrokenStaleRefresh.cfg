\* A listing that may miss a version created less than four ticks ago: a writer refreshes to a version the
\* listing showed as the latest while a later one stood, trusts it for its trust span, and creates the
\* key above it that vacuum had taken meanwhile. Must violate NoFork. Takes a minute.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2, w3}
    Window = 4
    TrustSpan = 2
    VacuumSkew = 0
    WriterDrift = 0
    ListingLag = 4
    MaxTime = 8
    MaxVersions = 4
    Passes = 1
    Refreshes = TRUE
    Guard = TRUE
SYMMETRY Symmetry
INVARIANT NoFork
CHECK_DEADLOCK FALSE
