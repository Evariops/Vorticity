\* A listing that may miss a version created less than four ticks ago: vacuum marks from a version older than
\* the latest, and takes for an orphan the object of the version it does not see. Must violate
\* LatestReadable.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2, w3}
    Window = 4
    TrustSpan = 2
    VacuumSkew = 0
    WriterDrift = 0
    ListingLag = 4
    MaxTime = 8
    MaxVersions = 4
    Passes = 2
    Refreshes = FALSE
    Guard = TRUE
SYMMETRY Symmetry
INVARIANT LatestReadable
CHECK_DEADLOCK FALSE
