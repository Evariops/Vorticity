\* A writer's clock that falls three ticks behind the reading it is compared with, a clock stepped back
\* or a pause before the put, with the vacuum's clock exact: the writer still trusts the version it holds
\* when vacuum has taken the ones after it, and creates the key above it. Must violate NoFork.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2, w3}
    Window = 4
    TrustSpan = 2
    VacuumSkew = 0
    WriterDrift = 3
    ListingLag = 0
    MaxTime = 8
    MaxVersions = 4
    Passes = 2
    Refreshes = FALSE
    Guard = TRUE
SYMMETRY Symmetry
INVARIANT NoFork
CHECK_DEADLOCK FALSE
