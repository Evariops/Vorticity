\* The positive configuration with writers that refresh whenever they like, which takes minutes.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2, w3}
    Window = 4
    TrustSpan = 2
    VacuumSkew = 1
    WriterDrift = 1
    ListingLag = 0
    MaxTime = 7
    MaxVersions = 4
    Passes = 1
    Refreshes = TRUE
    Guard = TRUE
SYMMETRY Symmetry
INVARIANT LatestReadable NoFork RetainedReadable
CHECK_DEADLOCK FALSE
