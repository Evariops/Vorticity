\* A trust span past half the window, with the vacuum's clock and a writer's a tick off each: vacuum
\* deletes the versions after the one the writer holds while it still trusts it, and the writer creates
\* the key above it that vacuum had taken. Must violate NoFork.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2, w3}
    Window = 4
    TrustSpan = 3
    VacuumSkew = 1
    WriterDrift = 1
    ListingLag = 0
    MaxTime = 8
    MaxVersions = 4
    Passes = 2
    Refreshes = FALSE
    Guard = TRUE
SYMMETRY Symmetry
INVARIANT NoFork
CHECK_DEADLOCK FALSE
