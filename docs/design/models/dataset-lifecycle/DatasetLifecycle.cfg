\* Three writers, a window of four ticks, the trust span and the guard at half of it, the vacuum's clock
\* off by a tick either way and a writer's by a tick behind, which use up the other half, a listing that
\* never lags, two passes of vacuum.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2, w3}
    Window = 4
    TrustSpan = 2
    VacuumSkew = 1
    WriterDrift = 1
    ListingLag = 0
    MaxTime = 8
    MaxVersions = 4
    Passes = 2
    Refreshes = FALSE
    Guard = TRUE
SYMMETRY Symmetry
INVARIANT LatestReadable NoFork RetainedReadable
CHECK_DEADLOCK FALSE
