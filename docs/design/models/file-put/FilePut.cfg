\* The fix: a temporary file published whole by an exclusive rename or a link, with locks, the repair
\* and crashes.
SPECIFICATION Spec
CONSTANTS
    Writers = {"a", "b"}
    Readers = {"r"}
    Protocol = "whole"
    Locking = TRUE
    Repair = TRUE
    Crashes = TRUE
    Patience = 1
INVARIANT CreatedStays ExistsMeansAnother TornOnlyWhenAbandoned
PROPERTY StoreSafety
CHECK_DEADLOCK FALSE
