\* The tempting fix that is not one: File.Move(temp, key, overwrite: false), which .NET runs on Unix as
\* lstat then rename(2). Two puts both find the key free, and the second rename replaces the first
\* put's commit. Must violate CreatedStays.
SPECIFICATION Spec
CONSTANTS
    Writers = {"a", "b"}
    Readers = {"r"}
    Protocol = "move"
    Locking = TRUE
    Repair = FALSE
    Crashes = FALSE
    Patience = 1
INVARIANT CreatedStays
CHECK_DEADLOCK FALSE
