\* The code at 3da99dca without flock: the repair deletes a commit still being written, and its put
\* answers Created for an object that is gone. Must violate CreatedStays.
SPECIFICATION Spec
CONSTANTS
    Writers = {"a", "b"}
    Readers = {"r"}
    Protocol = "claim"
    Locking = FALSE
    Repair = TRUE
    Crashes = FALSE
    Patience = 1
INVARIANT CreatedStays
CHECK_DEADLOCK FALSE
