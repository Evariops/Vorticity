\* The fix on a file system without flock, or under DOTNET_SYSTEM_IO_DISABLEFILELOCKING: a publication
\* in one step needs no lock.
SPECIFICATION Spec
CONSTANTS
    Writers = {"a", "b"}
    Readers = {"r"}
    Protocol = "whole"
    Locking = FALSE
    Repair = TRUE
    Crashes = TRUE
    Patience = 1
INVARIANT CreatedStays ExistsMeansAnother TornOnlyWhenAbandoned
PROPERTY StoreSafety
CHECK_DEADLOCK FALSE
