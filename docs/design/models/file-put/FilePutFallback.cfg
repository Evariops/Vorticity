\* The fallback, on a file system without hard links: the claim, with a failed put's file deleted
\* under its lock, and a refused lock failing rather than answering Exists. Without the repair
\* running beside the writers, no answer lies.
SPECIFICATION Spec
CONSTANTS
    Writers = {"a", "b"}
    Readers = {"r"}
    Protocol = "claimfix"
    Locking = TRUE
    Repair = FALSE
    Crashes = TRUE
    Patience = 1
INVARIANT CreatedStays ExistsMeansAnother
CHECK_DEADLOCK FALSE
