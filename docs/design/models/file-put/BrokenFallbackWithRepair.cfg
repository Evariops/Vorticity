\* The limit of the fallback: the repair, which judges a file then deletes the key by its path,
\* can delete a commit being written that it read in the gap before its lock. Must violate
\* CreatedStays.
SPECIFICATION Spec
CONSTANTS
    Writers = {"a", "b"}
    Readers = {"r"}
    Protocol = "claimfix"
    Locking = TRUE
    Repair = TRUE
    Crashes = FALSE
    Patience = 1
INVARIANT CreatedStays
CHECK_DEADLOCK FALSE
