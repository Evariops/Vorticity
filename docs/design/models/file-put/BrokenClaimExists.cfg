\* The code at 3da99dca: a reader that opens the key between a put's open and its lock makes the
\* lock fail, and the put answers Exists for the file it created itself. Must violate
\* ExistsMeansAnother.
SPECIFICATION Spec
CONSTANTS
    Writers = {"a", "b"}
    Readers = {"r"}
    Protocol = "claim"
    Locking = TRUE
    Repair = FALSE
    Crashes = FALSE
    Patience = 1
INVARIANT ExistsMeansAnother
CHECK_DEADLOCK FALSE
