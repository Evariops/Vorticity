# Release Drafter config, read by .github/workflows/release-drafter.yml.
#
# Every merge to main updates a draft release, its version resolved from the merged pull requests'
# labels. Publishing the draft creates the tag and fires the release run of build.yml, which runs
# every check again on that tag and then pushes the packages to nuget.org.
#
# Only merged pull requests reach the notes: a commit pushed straight to main never appears. Labels
# come from the pull request's title, in the Conventional Commits form the commits use, and from
# the files it touches (autolabeler below); `skip-changelog` hides a pull request.

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# The autolabel job collapses each pull request to one category label, by priority, so none
# appears in two sections. Keep this list in the order of that priority list.
categories:
  - title: '💥 Breaking changes'
    labels: ['breaking']
  - title: '🚀 Features'
    labels: ['feature']
  - title: '🐛 Bug fixes'
    labels: ['bug']
  - title: '⚡ Performance'
    labels: ['performance']
  - title: '📚 Documentation'
    labels: ['documentation']
  - title: '🔧 Build, CI and tooling'
    labels: ['ci']
  - title: '📦 Dependencies'
    labels: ['dependencies']
    collapse-after: 3
  - title: '🧹 Maintenance'
    labels: ['maintenance']
    collapse-after: 5

exclude-labels: ['skip-changelog']

change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&' # markdown metacharacters in pull request titles

# Below 1.0.0 a breaking change moves the minor version, as SemVer allows there; `breaking` moves
# to `major` with 1.0.
version-resolver:
  minor:
    labels: ['breaking', 'feature', 'performance']
  patch:
    labels: ['bug', 'documentation', 'ci', 'dependencies', 'maintenance']
  default: patch

autolabeler:
  - label: 'breaking'
    title: ['/^\w+(\([^)]*\))?!:/']
    body: ['/^BREAKING CHANGE:/m']
  - label: 'feature'
    title: ['/^feat(\([^)]*\))?!?:/i']
  - label: 'bug'
    title: ['/^fix(\([^)]*\))?!?:/i']
  - label: 'performance'
    title: ['/^perf(\([^)]*\))?!?:/i']
  - label: 'documentation'
    title: ['/^docs(\([^)]*\))?!?:/i']
    files: ['**/*.md']
  - label: 'ci'
    title: ['/^(ci|build)(\([^)]*\))?!?:/i']
    files: ['.github/**']
  - label: 'dependencies'
    files: ['Directory.Packages.props', 'global.json', 'nuget.config', '**/Cargo.toml', '**/Cargo.lock']
  - label: 'maintenance'
    title: ['/^(refactor|test|chore|bench)(\([^)]*\))?!?:/i']

template: |
  ## What's Changed

  $CHANGES

  ---

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

no-changes-template: '- No merged pull requests since the last release.'
