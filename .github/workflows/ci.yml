name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # docs/05-benchmarks.md §1: every kernel has a NEON path by contract, so the arm64 leg is
        # not optional - without it that contract is untested.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Vorticity.slnx

      - name: Build
        run: dotnet build Vorticity.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Vorticity.slnx --no-build -c Release

      # docs/03-architecture.md §4, invariant 4: every SIMD kernel has a scalar fallback, and the
      # fallback is only real if it is exercised. Running the whole suite with intrinsics disabled
      # is the cheapest way to keep that honest as kernels land.
      - name: Test (intrinsics disabled)
        run: dotnet test Vorticity.slnx --no-build -c Release
        env:
          DOTNET_EnableHWIntrinsic: '0'

  aot:
    name: native aot over the corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # docs/03-architecture.md §4, invariant 5. A library cannot prove it is AOT-clean; an
      # executable that opens a file and walks its layout tree can, because a reflection-shaped
      # mistake is a trim warning at publish or a failure at run. TreatWarningsAsErrors is on, so
      # an IL2xxx or IL3xxx warning fails this step rather than being scrolled past.
      - name: Publish vxdump as Native AOT
        run: dotnet publish tools/vxdump -c Release -r linux-x64

      - name: Run it over every corpus file
        run: |
          BIN=tools/vxdump/bin/Release/net11.0/linux-x64/publish/vxdump
          opened=0
          refused=0
          while IFS= read -r f; do
            if "$BIN" "$f" --all > /dev/null 2>&1; then
              opened=$((opened + 1))
            else
              refused=$((refused + 1))
            fi
          done < <(find tests/Vorticity.Conformance/corpus -name '*.vortex')
          echo "AOT vxdump: $opened opened, $refused refused"
          # One file uses the experimental vortex.list LAYOUT, which is in no core edition and
          # fails at open by design (docs/90-registry.md). Anything beyond that is a regression.
          test "$refused" -le 1

  fuzz:
    name: parser fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # docs/04-conformance.md §5 wants the long campaign nightly rather than per-commit, and the
      # per-commit half already runs as FuzzSmokeTests. This is the middle: enough mutations to be
      # worth the minute, with a FIXED SEED so a finding is reproducible from the log alone. The
      # program exits non-zero on a finding and warns when too few mutations got past the open
      # path -- a campaign that died in the postscript every time has proved nothing.
      - name: Fuzz the parser
        run: |
          dotnet run --project tests/Vorticity.Fuzz -c Release -- \
            tests/Vorticity.Conformance/corpus 100000 20260912

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-findings
          path: fuzz/artifacts/

  cross-check:
    name: Vortex Rust reads what we write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: dtolnay/rust-toolchain@stable

      # Criterion 2 of docs/01-scope.md §4, and the only check that can catch a writer and a reader
      # agreeing on the same mistake. The .NET step SKIPS when the variable is unset, so this job
      # sets it explicitly rather than relying on a default.
      - name: Write the corpus with Vorticity
        run: dotnet test Vorticity.slnx -c Release --filter-method '*WritesTheCorpusOutForTheRustCrossCheck*'
        env:
          VORTICITY_WRITE_CORPUS: ${{ runner.temp }}/written

      - name: Read it with the reference and compare scalar by scalar
        working-directory: tools/conformance-gen
        run: |
          cargo run --release --example verify_written -- \
            ../../tests/Vorticity.Conformance/corpus "${{ runner.temp }}/written"

  spec-drift:
    name: upstream schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A change here is a format change, not a dependency bump: it must be reviewed against
      # docs/90-registry.md and the conformance corpus regenerated. This job reports drift on a
      # schedule-friendly path without blocking unrelated PRs.
      - name: Re-vendor and diff
        continue-on-error: true
        run: |
          ./spec/refresh.sh
          if ! git diff --quiet -- spec/; then
            echo "::warning title=Upstream schema drift::spec/ differs from upstream develop"
            git diff -- spec/
          else
            echo "spec/ matches upstream develop"
          fi
