name: Pull request packages

# A pull request labelled build-packages publishes the library's packages to GitHub Packages as a
# pre-release, again on every push while the label stays, so that a project can try the change before
# it ships. The versions of a pull request are deleted when the label is taken off or the pull request
# is closed, merged or not, and a weekly sweep deletes whatever a failed cleanup left behind.
# CONTRIBUTING.md says how to consume them.
#
# Only someone who can write to the repository can publish. Applying a label takes the triage role.
# The trigger is pull_request and never pull_request_target, so a fork's code runs with a read-only
# token and no secret, label or not. The jobs that publish also require the branch to live in this
# repository, where only a writer can push, so that a fork's pull request is skipped instead of
# failing, and a push that publishes again comes from a writer too.

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened, closed]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

# Least privilege by default; each job raises only what it needs.
permissions: {}

# The runs of one pull request that publish or delete its packages queue behind each other, so that
# the cleanup of a closed pull request starts once its last publication has ended. Any other run, a
# label other than build-packages or a push to a pull request without it, gets a group of its own and
# holds nothing up.
concurrency:
  group: >-
    pr-packages-${{ (github.event.label.name == 'build-packages'
    || (github.event.action != 'labeled' && github.event.action != 'unlabeled'
    && contains(github.event.pull_request.labels.*.name, 'build-packages')))
    && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # Packing runs the pull request's code (its build, its generator), so it holds no write permission:
  # the push below takes the packages as an artifact and runs nothing from the branch.
  pack:
    name: pack the pull request's packages
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'build-packages')
      && (github.event.action == 'synchronize' || github.event.action == 'reopened'
      || (github.event.action == 'labeled' && github.event.label.name == 'build-packages'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # check out the pull request's branch
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The branch as pushed, not its merge into the base: the packages' source link then points at a
      # commit that outlives the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # The patch after the last release, then the pull request and the run: 0.14.1-pr.180.42. It
      # sorts above the release a consumer already has, so another package asking for at least that
      # release accepts it, and the run's number grows with every push, so 0.14.1-pr.180.* follows the
      # pull request's last one.
      - name: Choose the version
        id: version
        env:
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          latest=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's|.*refs/tags/v||' |
            { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)
          IFS=. read -r major minor patch <<< "${latest:-0.0.0}"
          version="$major.$minor.$((patch + 1))-pr.$PR.$RUN"
          echo "last release ${latest:-none}, version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Each packable project under src, the five that ship. The analyzers stay off: the CI run of the
      # same pull request holds the code to them, and checks the packages this packs the same way.
      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for project in src/*/*.csproj; do
            dotnet pack "$project" -c Release -p:Version="$VERSION" -p:RunAnalyzers=false \
              -o "$RUNNER_TEMP/packages"
          done
          ls "$RUNNER_TEMP/packages"

      # GitHub Packages takes no symbol package.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages/*.nupkg
          if-no-files-found: error
          retention-days: 3

  push:
    name: push the pre-release to GitHub Packages
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write # push to the organization's NuGet registry with the run's token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      # A package already there is skipped, so a re-run of a run that failed halfway completes it.
      # GitHub Packages has no trusted publishing to prefer: the credential is the run's own token,
      # which ends with the run.
      - name: Push # zizmor: ignore[use-trusted-publishing]
        env:
          TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          dotnet nuget push "packages/*.nupkg" --skip-duplicate --no-symbols \
            --api-key "$TOKEN" \
            --source "https://nuget.pkg.github.com/$OWNER/index.json"

      - name: Give the version in the run's summary
        env:
          VERSION: ${{ needs.pack.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "### $VERSION"
            echo
            echo "On https://nuget.pkg.github.com/$OWNER/index.json until the pull request is closed."
            echo "\`${VERSION%.*}.*\` follows its last push. The source and its token are set up as"
            echo "[CONTRIBUTING.md](https://github.com/$REPO/blob/main/CONTRIBUTING.md#a-pull-requests-packages) says."
            echo
            echo '```xml'
            for package in packages/*.nupkg; do
              id=$(basename "$package" ".$VERSION.nupkg")
              echo "<PackageReference Include=\"$id\" Version=\"$VERSION\" />"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The versions of one pull request when it is closed or loses the label, and on the weekly sweep the
  # versions of every pull request that is closed or no longer labelled. The repository holds the admin
  # role on the packages its workflows published, which lets the run's token delete their versions.
  cleanup:
    name: delete the pre-releases of pull requests that are done with them
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.head.repo.full_name == github.repository
      && ((github.event.action == 'closed'
      && contains(github.event.pull_request.labels.*.name, 'build-packages'))
      || (github.event.action == 'unlabeled' && github.event.label.name == 'build-packages')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # list the projects under src, each one a package of that name
      packages: write # delete package versions
      pull-requests: read # the sweep reads whether each pull request is still open and labelled
    steps:
      - name: Delete
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Each project under src is named after its package, on the default branch and on the pull
          # request's branch, which may add one. A project that is not packed has no package.
          projects() { gh api "repos/$REPO/contents/src$1" --jq '.[] | select(.type == "dir") | .name'; }
          names=$({ projects ""; if [ -n "$HEAD" ]; then projects "?ref=$HEAD" || true; fi; } | sort -u)

          # Whether the versions of pull request $1 go: this run's pull request, or on the sweep any
          # that is closed or no longer labelled.
          declare -A done_with
          goes() {
            if [ -n "$PR" ]; then [ "$1" = "$PR" ]; return; fi
            if [ -z "${done_with[$1]+set}" ]; then
              done_with[$1]=$(gh api "repos/$REPO/pulls/$1" \
                --jq '.state != "open" or all(.labels[]; .name != "build-packages")' < /dev/null)
            fi
            [ "${done_with[$1]}" = true ]
          }

          status=0
          for name in $names; do
            if ! versions=$(gh api --paginate "orgs/$OWNER/packages/nuget/$name/versions?per_page=100" \
                --jq '.[] | "\(.id) \(.name)"' 2> "$RUNNER_TEMP/error"); then
              if grep -q 'HTTP 404' "$RUNNER_TEMP/error"; then
                echo "$name: no package"
                continue
              fi
              cat "$RUNNER_TEMP/error"
              status=1
              continue
            fi
            left=$(grep -c . <<< "$versions" || true)
            while read -r id version; do
              [[ "$version" =~ -pr\.([0-9]+)\.[0-9]+$ ]] || continue
              goes "${BASH_REMATCH[1]}" || continue
              # Should the registry refuse to delete the last version of a package, the package goes
              # with it; a release pushed later creates it again.
              if gh api -X DELETE "orgs/$OWNER/packages/nuget/$name/versions/$id" < /dev/null; then
                echo "$name $version: deleted"
                left=$((left - 1))
              elif [ "$left" -eq 1 ] && gh api -X DELETE "orgs/$OWNER/packages/nuget/$name" < /dev/null; then
                echo "$name $version: the last version, deleted with its package"
                left=0
              else
                echo "::error::$name $version could not be deleted"
                status=1
              fi
            done <<< "$versions"
          done
          exit $status
