name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Publishing the draft Release Drafter keeps creates the tag and runs everything again on it,
  # then the publish job below.
  release:
    types: [published]

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

# The checks run side by side, each job on a Linux x64 runner of its own that builds what it needs:
# a build takes under two minutes, and one runner for everything would run the suites one after
# the other, twenty minutes on four vCPUs the tests keep busy. The
# library's one OS-specific path, the file identity behind the mapping cache, answers that it
# cannot tell where it has no binding.
jobs:
  test:
    name: test ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Vorticity
            projects: tests/Vorticity.Tests
            intrinsics: '1'
          - name: Vorticity.Zstd and the conformance corpus
            projects: tests/Vorticity.Zstd.Tests tests/Vorticity.Conformance
            intrinsics: '1'
            zstd-data: true
          # Every SIMD kernel has a scalar fallback, and the fallback is only real if it is
          # exercised: Vorticity's suites run again with intrinsics disabled. Vorticity.Zstd's do
          # not: its only vector paths are Arm's, which an x64 runner never takes, so the run above
          # already took every one of its fallbacks.
          - name: Vorticity and the conformance corpus, intrinsics disabled
            projects: tests/Vorticity.Tests tests/Vorticity.Conformance
            intrinsics: '0'
    steps:
      # Nothing here pushes to git: the token is not left on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        env:
          PROJECTS: ${{ matrix.projects }}
        run: |
          for project in $PROJECTS; do
            dotnet build "$project" -c Release
          done

      # Vorticity.Zstd's tests read zstd's golden files and a corpus of frames from zstd's
      # decodecorpus, which the repository does not keep: written here from zstd 1.5.7's release,
      # checked against its SHA-256. The tests that read them fail in CI without them.
      - name: Write Vorticity.Zstd's test data
        if: matrix.zstd-data
        run: bash tools/native-ref/testdata.sh

      - name: Test
        env:
          PROJECTS: ${{ matrix.projects }}
          DOTNET_EnableHWIntrinsic: ${{ matrix.intrinsics }}
        run: |
          status=0
          for project in $PROJECTS; do
            dotnet test --project "$project" --no-build -c Release || status=1
          done
          exit $status

  package:
    name: pack, publish vxdump as Native AOT, fuzz the parser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A release run uploads an artifact; nothing pushes to git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # A release v1.2.3 is built as 1.2.3: the assemblies, and the packages the publish job
      # pushes. Any other run leaves the version unset and packs the SDK's default, a file name and
      # not a claim.
      - name: Resolve the version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::$GITHUB_REF_NAME is not a v followed by a SemVer version"
              exit 1
            fi
            echo "VERSION_PROPERTY=-p:Version=$version" >> "$GITHUB_ENV"
          fi

      - name: Restore
        run: dotnet restore Vorticity.slnx

      - name: Build
        run: dotnet build Vorticity.slnx --no-restore -c Release ${VERSION_PROPERTY:+"$VERSION_PROPERTY"}

      # The five packages are what a consumer gets, and nothing else here builds them. Most of
      # what can go wrong is visible at pack time and nowhere else: a readme or a NOTICE that stops
      # being found, a license expression that stops parsing, a project that becomes packable by
      # accident. Warnings are errors, so a pack warning fails the job.
      - name: Pack
        run: dotnet pack Vorticity.slnx --no-build -c Release ${VERSION_PROPERTY:+"$VERSION_PROPERTY"}

      # A satellite reads the internals of the packages it references, so it must depend on exactly
      # the version it was built with. Pack writes "this version or later" unless a private target
      # of the SDK is hooked, as Directory.Build.targets does: this fails when an SDK update leaves
      # a range behind, or leaves no dependency to check.
      - name: Check that each package names the exact version of the packages it references
        run: |
          set -euo pipefail
          found=0
          for package in src/*/bin/Release/*.nupkg; do
            dependencies=$(unzip -p "$package" '*.nuspec' | grep -o '<dependency id="Vorticity[^"]*" version="[^"]*"' || true)
            [ -z "$dependencies" ] && continue
            echo "$package"
            echo "$dependencies"
            found=$((found + $(echo "$dependencies" | wc -l)))
            if echo "$dependencies" | grep -v 'version="\[[^],]*\]"'; then
              echo "::error::$package accepts a range of a Vorticity package"
              exit 1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no package depends on a Vorticity package"
            exit 1
          fi

      # A release's packages are kept for the publish job, which pushes them only once every job of
      # the run has passed: the tests ran the same commit, built without the release's number.
      - name: Gather the packages of a release
        if: github.event_name == 'release'
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          cp src/*/bin/Release/*.nupkg src/*/bin/Release/*.snupkg "$RUNNER_TEMP/packages/"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'release'
        with:
          name: packages
          path: ${{ runner.temp }}/packages
          if-no-files-found: error

      # The long campaign belongs to a nightly run rather than to each commit, and the per-commit
      # half already runs as FuzzSmokeTests. This is the middle: enough mutations to be worth the
      # minute, with a fixed seed so a finding is reproducible from the log alone. The
      # program exits non-zero on a finding and warns when too few mutations got past the open
      # path -- a campaign that died in the postscript every time has proved nothing.
      - name: Fuzz the parser
        run: |
          dotnet run --project tests/Vorticity.Fuzz -c Release --no-build -- \
            tests/Vorticity.Conformance/corpus 100000 20260912

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-findings
          path: fuzz/artifacts/
          if-no-files-found: ignore

      # A library cannot prove it is AOT-clean; an executable that opens a file and walks its
      # layout tree can, because a reflection-shaped mistake is a trim warning at publish or a
      # failure at run. TreatWarningsAsErrors is on, so
      # an IL2xxx or IL3xxx warning fails this step rather than being scrolled past.
      - name: Publish vxdump as Native AOT
        run: dotnet publish tools/vxdump -c Release -r linux-x64

      - name: Open every corpus file with the AOT vxdump
        run: |
          BIN=tools/vxdump/bin/Release/net11.0/linux-x64/publish/vxdump
          opened=0
          refused=0
          while IFS= read -r f; do
            if "$BIN" "$f" --all > /dev/null 2>&1; then
              opened=$((opened + 1))
            else
              refused=$((refused + 1))
            fi
          done < <(find tests/Vorticity.Conformance/corpus -name '*.vortex')
          echo "AOT vxdump: $opened opened, $refused refused"
          # One file, types/no_dtype_segment, embeds no schema, so opening it without one supplied
          # through VortexOpenOptions is refused by design. Anything beyond that is a regression.
          test "$refused" -le 1

      # The decoders and the scan are generic over the value types and dispatch through static
      # abstract interface members - the shape most likely to compile clean and then fail to find
      # an instantiation at run time under Native AOT. --scan decodes every batch of every file, so
      # it also meets the encodings no core edition carries.
      #
      # Exit 3 (unsupported) and 4 (malformed) are expected answers for parts of this corpus; any
      # other non-zero exit is an unhandled exception and fails the job. The coverage floor is what
      # makes "0 failures" mean something: a run where every file refused would otherwise pass.
      - name: Scan every corpus file with the AOT vxdump
        run: |
          BIN=tools/vxdump/bin/Release/net11.0/linux-x64/publish/vxdump
          scanned=0
          refused=0
          crashed=0
          while IFS= read -r f; do
            if "$BIN" "$f" --scan > /dev/null 2>&1; then code=0; else code=$?; fi
            if [ "$code" = 0 ]; then
              scanned=$((scanned + 1))
            elif [ "$code" = 3 ] || [ "$code" = 4 ]; then
              refused=$((refused + 1))
            else
              echo "vxdump --scan exited $code on $f"
              crashed=$((crashed + 1))
            fi
          done < <(find tests/Vorticity.Conformance/corpus -name '*.vortex')
          echo "AOT scan: $scanned scanned, $refused refused, $crashed crashed"
          test "$crashed" = 0
          test "$scanned" -ge 800

  crosscheck:
    name: cross-check with the reference
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build tests/Vorticity.Tests -c Release

      # The one test that writes the corpus out for the reference, which skips unless the variable
      # names a directory.
      - name: Write the corpus with this writer
        run: |
          dotnet test --project tests/Vorticity.Tests --no-build -c Release \
            --filter-method '*WritesTheCorpusOutForTheRustCrossCheck*'
        env:
          VORTICITY_WRITE_CORPUS: ${{ runner.temp }}/written

      # The runner image ships rustup, and its stable can trail the minimum the pinned crates need.
      - name: Update the Rust toolchain
        id: rust
        run: |
          rustup update stable --no-self-update && rustup default stable
          echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      # Building the reference's crates is the longest step of the job, so their build is kept
      # from one run to the next until the lock file or the compiler changes. A release run builds
      # them from scratch: nothing restored from a cache runs in a release run, which zizmor cannot
      # see through the condition.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        if: github.event_name != 'release'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            tools/conformance-gen/target
          key: cargo-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('tools/conformance-gen/Cargo.lock') }}

      # The reference reading what we write is the only check that can catch a writer and a reader
      # agreeing on the same mistake.
      - name: Read the written corpus with the reference and compare scalar by scalar
        working-directory: tools/conformance-gen
        run: |
          cargo run --release --example verify_written -- \
            ../../tests/Vorticity.Conformance/corpus "${{ runner.temp }}/written"

      # A change here is a format change, not a dependency bump: it must be reviewed against the
      # component registry and the conformance corpus regenerated. It is reported as a warning,
      # after everything else, so that it never blocks an unrelated change.
      - name: Report upstream schema drift
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          ./spec/refresh.sh
          if ! git diff --quiet -- spec/; then
            echo "::warning title=Upstream schema drift::spec/ differs from upstream develop"
            git diff -- spec/
          else
            echo "spec/ matches upstream develop"
          fi

  # A published release's packages go to nuget.org, under the Evariops account. Trusted Publishing trades
  # the job's GitHub OIDC token for an API key that lives an hour, so no key is stored here; the
  # policy nuget.org holds names this repository, this file (build.yml) and the release
  # environment: renaming either stops the push.
  publish:
    name: push the packages to nuget.org
    needs: [test, package, crosscheck]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: packages

      # The user is the nuget.org account that created the trusted publishing policy, not the
      # Evariops organization that owns the packages. It is a variable of the release environment,
      # read when the job runs, so a change of account needs no new tag: re-run the failed job.
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      # Each .snupkg goes up with its .nupkg. A package already there is skipped, so a push that
      # failed halfway can be re-run.
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "packages/*.nupkg" --skip-duplicate \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json
