[package]
name = "conformance-gen"
version = "0.2.0"
edition = "2021"
publish = false
description = "Generates the golden Vortex corpus and expected-value sidecars for Vorticity conformance tests."

# Pinned deliberately and exactly. Every release records the Vortex
# version its corpus was generated against, and a version bump is a corpus regeneration, not a
# dependency update.
#
# 0.86.1 is the version the specification was derived against, and the newest
# release; it can target every frozen core edition up to core2026.08.3, so the corpus can cover
# every component in our scope with nothing left out. It requires rustc >= 1.95 (local
# toolchain is 1.98.1, verified).
[dependencies]
vortex = "=0.87.0"
# Only needed to name individual compression schemes: `SchemeId` is opaque outside this crate,
# and the `vortex` facade re-exports the compressor types but not `vortex_btrblocks::schemes`.
vortex-btrblocks = "=0.87.0"
# `vortex.onpair` is the one encoding whose array crate the `vortex` facade does not re-export
# (see `vortex-0.86.1/src/lib.rs`'s `pub mod encodings`), and forcing it needs `onpair_compress`.
vortex-onpair = "=0.86.1"
# Ground truth for the `vortex.pco` port: pco's own metadata parser, so a C# parser can be checked
# field by field against the reference rather than against my reading of its source.
pco = "=1.0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
anyhow = "1"
# Only for `FutureExt::catch_unwind`: several 0.86.1 writer limitations surface as panics
# rather than errors, and one unsupported recipe must not take the whole corpus run down.
futures-lite = "2"
# Ground truth for the Parquet-compatible Bloom variant: the filter our
# `BloomHash.XxHash64` writes must be bit-identical to a Parquet SBBF over the same keys, and the
# only honest way to say that is to build one with Parquet's own implementation. Default features
# off, so this pulls the format crate and not arrow; `bloom_filter::Sbbf` needs nothing else.
parquet = { version = "=60.0.0", default-features = false }

[profile.release]
opt-level = 1
debug = false
