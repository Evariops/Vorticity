[package]
name = "vxbench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Vortex's Rust reader and writer, as a cdylib for in-process ratios and as a binary for the published report, so both run the same code."

[lib]
# The cdylib is what BenchmarkDotNet loads; the rlib is what the binary links, so the scenarios the
# report runs are the same functions the in-process ratios measure.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vxbench"
path = "src/main.rs"

# The same crates.io pin tools/conformance-gen uses. Not a git dependency and not `vortex-ffi`:
# see the README for why the shim is purpose-built rather than borrowed.
[dependencies]
# `tokio` for the runtime upstream's benchmarks run on: `with_tokio` over a multi-threaded runtime,
# which is how the reference uses every core.
vortex = { version = "=0.86.1", features = ["tokio"] }
tokio = { version = "1.53", features = ["rt-multi-thread"] }
# The allocator upstream's benchmarks all run with, "for consistency" (vortex-bench), and the one
# its README recommends: measured on the system allocator, the reference is not what its users run.
mimalloc = "=0.1.52"
futures = "0.3"
# For getrusage, so the binary reports the same two figures our side reports: the processor time
# and the peak resident set of the process it ran in.
libc = "0.2"

# Upstream's benchmark profile, `release_debug`: one codegen unit, no LTO, full debug information.
# The target CPU and the frame pointers are its RUSTFLAGS, which `.cargo/config.toml` sets.
[profile.release]
codegen-units = 1
lto = "off"
debug = "full"
