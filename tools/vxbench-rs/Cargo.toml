[package]
name = "vxbench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Vortex's Rust reader, as a cdylib for in-process ratios and as a binary for the published report, so both sides run the same code either way."

[lib]
# The cdylib is what BenchmarkDotNet loads; the rlib is what the binary links, so the scenarios the
# report runs are the same functions the in-process ratios measure.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vxbench"
path = "src/main.rs"

# The SAME crates.io pin tools/conformance-gen uses. Not a git dependency and not `vortex-ffi`:
# see the README for why the shim is purpose-built rather than borrowed.
[dependencies]
vortex = "=0.86.1"
futures = "0.3"
# For getrusage, so the binary reports the same two figures our side reports: the processor time
# and the peak resident set of the process it ran in.
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
